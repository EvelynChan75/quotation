<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寬聯資訊股份有限公司 - 報價單系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        
        /* A4 列印設定 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
            }
            .page-break {
                page-break-after: always;
            }
            input, textarea {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                padding: 0 !important;
            }
            /* 隱藏原生 input number 的箭頭 */
            input[type=number]::-webkit-inner-spin-button,
            input[type=number]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type=number] {
                -moz-appearance: textfield;
            }
        }

        /* 隱藏數字輸入框的上下箭頭 */
        .no-spinner::-webkit-inner-spin-button,
        .no-spinner::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .no-spinner {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="py-8 px-4 min-h-screen">

    <!-- 控制面板 (列印時隱藏) -->
    <div class="max-w-4xl mx-auto mb-6 bg-white p-4 rounded-xl shadow-md border border-gray-200 no-print">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-file-invoice text-2xl text-cyan-600"></i>
                <h1 class="text-xl font-bold text-gray-800">線上報價單產生器</h1>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="loadSampleData()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> 載入範例
                </button>
                <button onclick="clearData()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> 清空
                </button>
                <button onclick="window.print()" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-medium rounded-lg shadow transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> 導出 PDF / 列印
                </button>
            </div>
        </div>
    </div>

    <!-- 報價單主體容器 (A4 比例) -->
    <div class="max-w-4xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-xl border border-gray-200 print-container relative">
        
        <!-- 頂部區塊：Logo & 賣方資訊 / 報價單標題 -->
        <div class="flex flex-col md:flex-row justify-between items-start border-b border-gray-200 pb-8 mb-8 gap-6">
            
            <!-- 左側：公司標誌與賣方資料 -->
            <div class="w-full md:w-2/3 space-y-4">
                <!-- 公司 Logo 上傳/顯示區 -->
                <div class="relative group w-48 h-16 flex items-center justify-center border-2 border-dashed border-gray-200 rounded-lg hover:border-cyan-500 transition cursor-pointer overflow-hidden" onclick="document.getElementById('logoInput').click()">
                    <div id="logoPreview" class="w-full h-full flex items-center justify-center">
                        <!-- 預設 SVG Logo -->
                        <div class="flex items-center space-x-2">
                            <svg class="w-10 h-10 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V9a2 2 0 012-2h2a2 2 0 012 2v12"></path>
                            </svg>
                            <span class="font-bold text-lg text-gray-800 tracking-wider">寬聯資訊</span>
                        </div>
                    </div>
                    <div class="absolute inset-0 bg-black/40 text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition no-print">
                        點擊更換 Logo
                    </div>
                    <input type="file" id="logoInput" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'logoPreview')">
                </div>

                <!-- 賣方公司詳細資料 (單行無折行優化) -->
                <div class="space-y-1.5 text-sm">
                    <input type="text" id="sellerName" class="font-bold text-gray-800 text-lg w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="寬聯資訊股份有限公司" placeholder="公司名稱">
                    
                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 min-w-[70px] shrink-0">統一編號：</span>
                        <input type="text" id="sellerTaxId" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="52784735" placeholder="統編">
                    </div>

                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 min-w-[70px] shrink-0">聯絡資訊：</span>
                        <input type="text" id="sellerContact" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="詹嘉鈴 0911840257" placeholder="聯絡人 / 電話">
                    </div>

                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 min-w-[70px] shrink-0">電子郵件：</span>
                        <input type="text" id="sellerEmail" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="lynn.zhan@kli.com.tw" placeholder="Email">
                    </div>

                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 min-w-[70px] shrink-0">公司地址：</span>
                        <input type="text" id="sellerAddress" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="114 台北市內湖區新湖二路211號6樓" placeholder="地址">
                    </div>
                </div>
            </div>

            <!-- 右側：報價單標題與報價日期 -->
            <div class="w-full md:w-1/3 text-left md:text-right space-y-4">
                <div>
                    <h2 class="text-3xl font-extrabold text-cyan-900 tracking-wider">報 價 單</h2>
                    <p class="text-xs text-gray-400 tracking-widest uppercase mt-1">Quotation</p>
                </div>

                <!-- 報價日期單獨顯示區 -->
                <div class="inline-block bg-gray-50 p-3 rounded-lg border border-gray-100 w-full md:w-auto text-left">
                    <div class="flex items-center justify-between md:justify-end gap-3 text-sm">
                        <span class="text-gray-500 font-medium">報價日期：</span>
                        <input type="date" id="quoteDate" class="bg-transparent font-semibold text-gray-800 focus:outline-none">
                    </div>
                </div>
            </div>
        </div>

        <!-- 買方 / 客戶資料區 -->
        <div class="bg-slate-50 p-6 rounded-xl border border-slate-200/60 mb-8">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">買方 / 客戶資料 (Client Information)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <input type="text" id="clientName" class="font-bold text-gray-800 text-base w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-1 border border-transparent focus:border-gray-300" placeholder="客戶 / 公司名稱" value="極致科技股份有限公司">
                    <div class="flex items-center text-sm text-gray-600">
                        <span class="text-xs text-gray-400 w-16 shrink-0">統一編號:</span>
                        <input type="text" id="clientTaxId" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="買方統編" value="12345678">
                    </div>
                    <div class="flex items-center text-sm text-gray-600">
                        <span class="text-xs text-gray-400 w-16 shrink-0">聯絡人:</span>
                        <input type="text" id="clientContact" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="聯絡人姓名/職稱" value="張專案經理">
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex items-center text-sm text-gray-600">
                        <span class="text-xs text-gray-400 w-16 shrink-0">電話:</span>
                        <input type="text" id="clientPhone" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="聯絡電話" value="02-2345-6789">
                    </div>
                    <div class="flex items-center text-sm text-gray-600">
                        <span class="text-xs text-gray-400 w-16 shrink-0">Email:</span>
                        <input type="text" id="clientEmail" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="電子郵件" value="pm@tech-corp.com">
                    </div>
                    <div class="flex items-center text-sm text-gray-600">
                        <span class="text-xs text-gray-400 w-16 shrink-0">地址:</span>
                        <input type="text" id="clientAddress" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="地址" value="台中市西屯區台灣大道三段 99 號">
                    </div>
                </div>
            </div>
        </div>

        <!-- 報價項目表格 -->
        <div class="overflow-x-auto mb-8">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b-2 border-gray-800 text-gray-700 text-xs uppercase tracking-wider">
                        <th class="py-3 px-2 w-10 text-center">#</th>
                        <th class="py-3 px-2">品名 / 服務描述</th>
                        <th class="py-3 px-2 w-20 text-center">數量</th>
                        <th class="py-3 px-2 w-20 text-center">單位</th>
                        <th class="py-3 px-2 w-28 text-right">單價</th>
                        <th class="py-3 px-2 w-32 text-right">小計</th>
                        <th class="py-3 px-2 w-10 text-center no-print"></th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody" class="divide-y divide-gray-100 text-sm">
                    <!-- 動態由 JavaScript 產生 -->
                </tbody>
            </table>

            <!-- 新增項目按鈕 -->
            <div class="mt-4 no-print">
                <button onclick="addItem()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> 新增報價項目
                </button>
            </div>
        </div>

        <!-- 結算總計與蓋章簽署區 -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-8 border-t border-gray-200 pt-6">
            
            <!-- 左側：備註條款 -->
            <div class="w-full md:w-1/2 space-y-3">
                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider">備註</h4>
                <textarea id="notes" rows="5" class="w-full text-xs text-gray-600 bg-gray-50 border border-gray-200 rounded-lg p-3 focus:outline-none focus:bg-white transition" placeholder="填寫備註或注意事項...">1. 本報價單經蓋章即視為正式訂單且具法律效用
2. 以上報價有效期限：
3. 有關規定未盡詳部分，若有合約則以合約書為準 
4. 本報價單未經本公司書面同意，不得對外公開本報價單之存在或內容</textarea>
            </div>

            <!-- 右側：金額計算小計與印章 -->
            <div class="w-full md:w-5/12 space-y-4">
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between text-gray-600">
                        <span>小計 (Subtotal)</span>
                        <span id="subtotalDisplay" class="font-medium">NT$ 0</span>
                    </div>

                    <!-- 營業稅設定 (預設 5%) -->
                    <div class="flex justify-between items-center text-gray-600">
                        <div class="flex items-center gap-1">
                            <span>營業稅</span>
                            <select id="taxRate" onchange="calculateTotals()" class="text-xs bg-gray-100 border border-gray-200 rounded px-1 py-0.5 no-print">
                                <option value="0.05" selected>5%</option>
                                <option value="0">免稅 (0%)</option>
                            </select>
                        </div>
                        <span id="taxDisplay" class="font-medium">NT$ 0</span>
                    </div>

                    <div class="border-t border-gray-200 pt-2 mt-2 flex justify-between items-center">
                        <span class="text-base font-bold text-gray-900">總計 (Total)</span>
                        <span id="grandTotalDisplay" class="text-xl font-extrabold text-cyan-900">NT$ 0</span>
                    </div>
                </div>

                <!-- 公司蓋章 / 簽署區 -->
                <div class="pt-4 border-t border-dashed border-gray-200">
                    <div class="flex justify-between items-end">
                        <div class="text-xs text-gray-400">
                            公司蓋章 / 負責人簽署：
                        </div>
                        <!-- 印章圖片上傳/預覽 -->
                        <div class="relative group w-32 h-24 border-2 border-dashed border-gray-200 rounded-lg flex items-center justify-center cursor-pointer overflow-hidden" onclick="document.getElementById('stampInput').click()">
                            <div id="stampPreview" class="w-full h-full flex items-center justify-center p-1">
                                <!-- 預設紅色橢圓公司章 -->
                                <div class="w-24 h-16 border-2 border-red-500/80 rounded-[50%] flex flex-col items-center justify-center text-red-500/80 rotate-[-8deg] pointer-events-none">
                                    <span class="text-[10px] font-bold tracking-tighter">寬聯資訊股份有限公司</span>
                                    <span class="text-[9px] font-semibold border-t border-b border-red-500/80 my-0.5 px-1">報價專用章</span>
                                    <span class="text-[8px]">52784735</span>
                                </div>
                            </div>
                            <div class="absolute inset-0 bg-black/40 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition no-print">
                                點擊上傳印章
                            </div>
                            <input type="file" id="stampInput" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'stampPreview')">
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 頁尾宣告 -->
        <div class="mt-12 text-center text-xs text-gray-400 border-t border-gray-100 pt-4">
            感謝您的惠顧！如有任何問題，歡迎隨時與我們聯繫。
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 初始化日期為今日
        document.getElementById('quoteDate').valueAsDate = new Date();

        // 預設項目資料
        let items = [
            { description: '企業官網響應式 UI/UX 視覺設計', quantity: 1, unit: '項', price: 45000 },
            { description: '前端網頁開發與互動動畫整合', quantity: 1, unit: '項', price: 55000 },
            { description: '後端 API 串接與資料庫系統架設', quantity: 1, unit: '項', price: 40000 },
            { description: '雲端伺服器部署與安全性設定', quantity: 1, unit: '次', price: 12000 }
        ];

        // 渲染品項表格
        function renderItems() {
            const tbody = document.getElementById('itemsTableBody');
            tbody.innerHTML = '';

            items.forEach((item, index) => {
                const subtotal = item.quantity * item.price;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                tr.innerHTML = `
                    <td class="py-3 px-2 text-center text-gray-400 text-xs">${index + 1}</td>
                    <td class="py-3 px-2">
                        <input type="text" value="${escapeHtml(item.description)}" onchange="updateItem(${index}, 'description', this.value)" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-1 py-0.5 border border-transparent focus:border-gray-300" placeholder="品名細項">
                    </td>
                    <td class="py-3 px-2 text-center">
                        <input type="number" min="1" value="${item.quantity}" onchange="updateItem(${index}, 'quantity', parseFloat(this.value) || 0)" class="w-full text-center bg-transparent focus:outline-none focus:bg-white rounded px-1 py-0.5 border border-transparent focus:border-gray-300 no-spinner">
                    </td>
                    <td class="py-3 px-2 text-center">
                        <input type="text" value="${escapeHtml(item.unit)}" onchange="updateItem(${index}, 'unit', this.value)" class="w-full text-center bg-transparent focus:outline-none focus:bg-white rounded px-1 py-0.5 border border-transparent focus:border-gray-300" placeholder="單位">
                    </td>
                    <td class="py-3 px-2 text-right">
                        <input type="number" min="0" value="${item.price}" onchange="updateItem(${index}, 'price', parseFloat(this.value) || 0)" class="w-full text-right bg-transparent focus:outline-none focus:bg-white rounded px-1 py-0.5 border border-transparent focus:border-gray-300 no-spinner">
                    </td>
                    <td class="py-3 px-2 text-right font-medium text-gray-700">
                        NT$ ${subtotal.toLocaleString()}
                    </td>
                    <td class="py-3 px-2 text-center no-print">
                        <button onclick="removeItem(${index})" class="text-gray-300 hover:text-red-500 transition px-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            calculateTotals();
        }

        // 新增品項
        function addItem() {
            items.push({ description: '', quantity: 1, unit: '項', price: 0 });
            renderItems();
        }

        // 刪除品項
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }

        // 更新單一品項值
        function updateItem(index, field, value) {
            items[index][field] = value;
            renderItems();
        }

        // 計算總金額
        function calculateTotals() {
            const subtotal = items.reduce((sum, item) => sum + (item.quantity * item.price), 0);
            const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            const tax = Math.round(subtotal * taxRate);
            const grandTotal = subtotal + tax;

            document.getElementById('subtotalDisplay').textContent = `NT$ ${subtotal.toLocaleString()}`;
            document.getElementById('taxDisplay').textContent = `NT$ ${tax.toLocaleString()}`;
            document.getElementById('grandTotalDisplay').textContent = `NT$ ${grandTotal.toLocaleString()}`;
        }

        // 圖片上傳處置 (Logo / 印章)
        function handleImageUpload(event, previewId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewContainer = document.getElementById(previewId);
                    previewContainer.innerHTML = `<img src="${e.target.result}" class="max-h-full max-w-full object-contain">`;
                };
                reader.readAsDataURL(file);
            }
        }

        // 特殊字元轉義保護
        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 載入預設範例資料
        function loadSampleData() {
            document.getElementById('sellerName').value = '寬聯資訊股份有限公司';
            document.getElementById('sellerTaxId').value = '52784735';
            document.getElementById('sellerContact').value = '詹嘉鈴 0911840257';
            document.getElementById('sellerEmail').value = 'lynn.zhan@kli.com.tw';
            document.getElementById('sellerAddress').value = '114 台北市內湖區新湖二路211號6樓';

            document.getElementById('clientName').value = '極致科技股份有限公司';
            document.getElementById('clientTaxId').value = '12345678';
            document.getElementById('clientContact').value = '張專案經理';
            document.getElementById('clientPhone').value = '02-2345-6789';
            document.getElementById('clientEmail').value = 'pm@tech-corp.com';
            document.getElementById('clientAddress').value = '台中市西屯區台灣大道三段 99 號';

            document.getElementById('quoteDate').valueAsDate = new Date();
            document.getElementById('notes').value = `1. 本報價單經蓋章即視為正式訂單且具法律效用
2. 以上報價有效期限：
3. 有關規定未盡詳部分，若有合約則以合約書為準 
4. 本報價單未經本公司書面同意，不得對外公開本報價單之存在或內容`;

            items = [
                { description: '企業官網響應式 UI/UX 視覺設計', quantity: 1, unit: '項', price: 45000 },
                { description: '前端網頁開發與互動動畫整合', quantity: 1, unit: '項', price: 55000 },
                { description: '後端 API 串接與資料庫系統架設', quantity: 1, unit: '項', price: 40000 },
                { description: '雲端伺服器部署與安全性設定', quantity: 1, unit: '次', price: 12000 }
            ];
            renderItems();
        }

        // 清空欄位
        function clearData() {
            document.getElementById('clientName').value = '';
            document.getElementById('clientTaxId').value = '';
            document.getElementById('clientContact').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientEmail').value = '';
            document.getElementById('clientAddress').value = '';
            items = [];
            renderItems();
        }

        // 頁面初始化
        renderItems();
    </script>
</body>
</html>
