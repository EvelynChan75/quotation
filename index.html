<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寬聯資訊股份有限公司 - 報價單系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        
        /* A4 列印設定 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
            }
            input, textarea {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                padding: 0 !important;
            }
            /* 隱藏原生 input number 的箭頭 */
            input[type=number]::-webkit-inner-spin-button,
            input[type=number]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type=number] {
                -moz-appearance: textfield;
            }
        }

        /* 隱藏數字輸入框的上下箭頭 */
        .no-spinner::-webkit-inner-spin-button,
        .no-spinner::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .no-spinner {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="py-8 px-4 min-h-screen">

    <!-- 控制面板 (列印時隱藏) -->
    <div class="max-w-4xl mx-auto mb-6 bg-white p-4 rounded-xl shadow-md border border-gray-200 no-print">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-file-invoice text-2xl text-cyan-600"></i>
                <h1 class="text-xl font-bold text-gray-800">線上報價單產生器</h1>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="loadSampleData()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> 載入預設資料
                </button>
                <button onclick="clearData()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> 清空
                </button>
                <button onclick="window.print()" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-medium rounded-lg shadow transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> 導出 PDF / 列印
                </button>
            </div>
        </div>
    </div>

    <!-- 報價單主體容器 (A4 比例) -->
    <div class="max-w-4xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-xl border border-gray-200 print-container relative">
        
        <!-- 頂部區塊：Logo & 賣方資訊 / 報價單標題 -->
        <div class="flex flex-col md:flex-row justify-between items-start border-b border-gray-200 pb-8 mb-6 gap-6">
            
            <!-- 左側：公司標誌與賣方資料 -->
            <div class="w-full md:w-2/3 space-y-4">
                <!-- 公司 Logo 上傳/顯示區 -->
                <div class="relative group h-16 flex items-center border-2 border-dashed border-transparent hover:border-cyan-500 rounded-lg transition cursor-pointer overflow-hidden" onclick="document.getElementById('logoInput').click()">
                    <div id="logoPreview" class="h-full flex items-center">
                        <!-- 寬聯資訊 官方 Logo -->
                        <svg class="h-12 w-auto" viewBox="0 0 250 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g transform="translate(5, 10) scale(0.95)">
                                <polygon points="12,35 20,20 35,20 43,35 35,50 20,50" stroke="#88c437" stroke-width="3" fill="none"/>
                                <polygon points="28,48 36,33 51,33 59,48 51,63 36,63" stroke="#e9a818" stroke-width="3.5" fill="none"/>
                                <polygon points="46,28 54,13 69,13 77,28 69,43 54,43" stroke="#007bc7" stroke-width="4" fill="none"/>
                                <polygon points="63,48 71,33 86,33 94,48 86,63 71,63" stroke="#e9a818" stroke-width="3.5" fill="none"/>
                                <polygon points="78,22 86,7 101,7 109,22 101,37 86,37" stroke="#e06d10" stroke-width="4.5" fill="none"/>
                            </g>
                            <text x="115" y="48" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="28" fill="#231815" letter-spacing="2">寬聯資訊</text>
                        </svg>
                    </div>
                    <div class="absolute inset-0 bg-black/40 text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition no-print rounded-lg">
                        點擊更換 Logo
                    </div>
                    <input type="file" id="logoInput" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'logoPreview')">
                </div>

                <!-- 賣方公司詳細資料 -->
                <div class="space-y-1 text-sm">
                    <input type="text" id="sellerName" class="font-bold text-gray-800 text-lg w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="寬聯資訊股份有限公司" placeholder="公司名稱">
                    
                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">統一編號：</span>
                        <input type="text" id="sellerTaxId" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="52784735" placeholder="統編">
                    </div>

                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">聯絡資訊：</span>
                        <input type="text" id="sellerContact" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="詹嘉鈴 0911840257" placeholder="聯絡人 / 電話">
                    </div>

                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">電子郵件：</span>
                        <input type="text" id="sellerEmail" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="lynn.zhan@kli.com.tw" placeholder="Email">
                    </div>

                    <div class="flex items-center text-gray-600">
                        <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">公司地址：</span>
                        <input type="text" id="sellerAddress" class="w-full focus:outline-none focus:bg-gray-50 rounded px-1" value="114 台北市內湖區新湖二路211號6樓" placeholder="地址">
                    </div>
                </div>
            </div>

            <!-- 右側：報價單標題與報價日期 -->
            <div class="w-full md:w-1/3 text-left md:text-right space-y-4">
                <div>
                    <h2 class="text-3xl font-extrabold text-cyan-900 tracking-wider">報 價 單</h2>
                    <p class="text-xs text-gray-400 tracking-widest uppercase mt-1">Quotation</p>
                </div>

                <!-- 報價日期 -->
                <div class="inline-block bg-gray-50 p-3 rounded-lg border border-gray-100 w-full md:w-auto text-left">
                    <div class="flex items-center justify-between md:justify-end gap-3 text-sm">
                        <span class="text-gray-500 font-medium">報價日期：</span>
                        <input type="date" id="quoteDate" class="bg-transparent font-semibold text-gray-800 focus:outline-none">
                    </div>
                </div>
            </div>
        </div>

        <!-- 專案名稱 / 案名 區塊 -->
        <div class="bg-cyan-50/50 p-4 rounded-xl border border-cyan-100 mb-6 flex flex-col md:flex-row items-start md:items-center gap-2">
            <span class="text-xs font-bold text-cyan-900 uppercase tracking-wider whitespace-nowrap shrink-0">專案名稱 (PROJECT)：</span>
            <input type="text" id="projectName" class="font-bold text-gray-800 text-base w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-1 border border-transparent focus:border-cyan-300 transition" placeholder="請輸入專案案名" value="分行銷售例外報表新增優化及功能開發 (2027年)">
        </div>

        <!-- 買方 / 客戶資料區 -->
        <div class="bg-slate-50 p-6 rounded-xl border border-slate-200/60 mb-8">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">買方 / 客戶資料 (CLIENT INFORMATION)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-6">
                <!-- Row 1: 公司名稱 -->
                <div class="flex items-center">
                    <input type="text" id="clientName" class="font-bold text-gray-800 text-base w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-1 border border-transparent focus:border-gray-300" placeholder="客戶 / 公司名稱" value="台新國際商業銀行股份有限公司">
                </div>
                <div class="hidden md:block"></div>

                <!-- Row 2: 統一編號與電話 -->
                <div class="flex items-center text-sm text-gray-600">
                    <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">統一編號：</span>
                    <input type="text" id="clientTaxId" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="買方統編" value="86519539">
                </div>
                <div class="flex items-center text-sm text-gray-600">
                    <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">電話：</span>
                    <input type="text" id="clientPhone" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="聯絡電話" value="02-8798-9999#8538">
                </div>

                <!-- Row 3: 聯絡人與 Email -->
                <div class="flex items-center text-sm text-gray-600">
                    <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">聯絡人：</span>
                    <input type="text" id="clientContact" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="聯絡人姓名/職稱" value="陳永峰 經理">
                </div>
                <div class="flex items-center text-sm text-gray-600">
                    <span class="text-xs text-gray-400 w-20 shrink-0 whitespace-nowrap">Email：</span>
                    <input type="text" id="clientEmail" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-2 py-0.5 border border-transparent focus:border-gray-300" placeholder="電子郵件" value="931416@taishinbank.com.tw">
                </div>
            </div>
        </div>

        <!-- 報價項目表格 (品名欄位擴大並改為多行多文字) -->
        <div class="overflow-x-auto mb-8">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b-2 border-gray-800 text-gray-700 text-xs uppercase tracking-wider">
                        <th class="py-3 px-2 w-8 text-center">#</th>
                        <th class="py-3 px-2">品名 / 服務描述</th>
                        <th class="py-3 px-2 w-16 text-center">數量</th>
                        <th class="py-3 px-2 w-16 text-center">單位</th>
                        <th class="py-3 px-2 w-24 text-right">單價</th>
                        <th class="py-3 px-2 w-28 text-right">小計</th>
                        <th class="py-3 px-2 w-8 text-center no-print"></th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody" class="divide-y divide-gray-100 text-sm">
                    <!-- 動態由 JavaScript 產生 -->
                </tbody>
            </table>

            <!-- 新增項目按鈕 -->
            <div class="mt-4 no-print">
                <button onclick="addItem()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> 新增報價項目
                </button>
            </div>
        </div>

        <!-- 結算總計與蓋章簽署區 -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-8 border-t border-gray-200 pt-6">
            
            <!-- 左側：備註條款 -->
            <div class="w-full md:w-1/2 space-y-3">
                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider">備註</h4>
                <textarea id="notes" rows="5" class="w-full text-xs text-gray-600 bg-gray-50 border border-gray-200 rounded-lg p-3 focus:outline-none focus:bg-white transition" placeholder="填寫備註或注意事項...">1. 本報價單經蓋章即視為正式訂單且具法律效用
2. 以上報價有效期限：
3. 有關規定未盡詳部分，若有合約則以合約書為準 
4. 本報價單未經本公司書面同意，不得對外公開本報價單之存在或內容</textarea>
            </div>

            <!-- 右側：金額計算小計與印章 -->
            <div class="w-full md:w-5/12 space-y-4">
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between text-gray-600">
                        <span>小計 (Subtotal)</span>
                        <span id="subtotalDisplay" class="font-medium">NT$ 0</span>
                    </div>

                    <!-- 營業稅設定 (預設 5%) -->
                    <div class="flex justify-between items-center text-gray-600">
                        <div class="flex items-center gap-1">
                            <span>營業稅</span>
                            <select id="taxRate" onchange="calculateTotals()" class="text-xs bg-gray-100 border border-gray-200 rounded px-1 py-0.5 no-print">
                                <option value="0.05" selected>5%</option>
                                <option value="0">免稅 (0%)</option>
                            </select>
                        </div>
                        <span id="taxDisplay" class="font-medium">NT$ 0</span>
                    </div>

                    <div class="border-t border-gray-200 pt-2 mt-2 flex justify-between items-center">
                        <span class="text-base font-bold text-gray-900">總計 (Total)</span>
                        <span id="grandTotalDisplay" class="text-xl font-extrabold text-cyan-900">NT$ 0</span>
                    </div>
                </div>

                <!-- 公司蓋章 / 簽署區 -->
                <div class="pt-4 border-t border-dashed border-gray-200">
                    <div class="flex justify-between items-end">
                        <div class="text-xs text-gray-400">
                            公司蓋章 / 負責人簽署：
                        </div>
                        <!-- 印章圖片上傳/預覽 (藍色橢圓章) -->
                        <div class="relative group w-36 h-24 border-2 border-dashed border-transparent hover:border-cyan-500 rounded-lg flex items-center justify-center cursor-pointer overflow-hidden" onclick="document.getElementById('stampInput').click()">
                            <div id="stampPreview" class="w-full h-full flex items-center justify-center p-1">
                                <svg class="w-32 h-20" viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
                                    <ellipse cx="100" cy="65" rx="95" ry="60" fill="none" stroke="#255fa3" stroke-width="3" opacity="0.85"/>
                                    <ellipse cx="100" cy="65" rx="89" ry="54" fill="none" stroke="#255fa3" stroke-width="1.5" opacity="0.85"/>
                                    <ellipse cx="100" cy="65" rx="62" ry="34" fill="none" stroke="#255fa3" stroke-width="1.5" opacity="0.85"/>
                                    
                                    <path id="topArc" d="M 20,65 A 80,48 0 0,1 180,65" fill="none" />
                                    <text fill="#255fa3" font-size="14" font-weight="bold" opacity="0.85" letter-spacing="1">
                                        <textPath href="#topArc" startOffset="50%" text-anchor="middle">寬聯資訊股份有限公司</textPath>
                                    </text>

                                    <text x="100" y="58" fill="#255fa3" font-size="19" font-weight="900" text-anchor="middle" opacity="0.85" letter-spacing="2">報價專用章</text>
                                    <text x="100" y="78" fill="#255fa3" font-size="12" font-weight="bold" text-anchor="middle" opacity="0.85" letter-spacing="0.5">TEL:02-27921516</text>

                                    <path id="bottomArc" d="M 25,65 A 75,44 0 0,0 175,65" fill="none" />
                                    <text fill="#255fa3" font-size="10" font-weight="bold" opacity="0.85">
                                        <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">台北市內湖區新湖二路211號</textPath>
                                    </text>

                                    <g fill="#255fa3" opacity="0.85">
                                        <circle cx="24" cy="65" r="3"/>
                                        <circle cx="176" cy="65" r="3"/>
                                    </g>
                                </svg>
                            </div>
                            <div class="absolute inset-0 bg-black/40 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition no-print rounded-lg">
                                點擊上傳印章
                            </div>
                            <input type="file" id="stampInput" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'stampPreview')">
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 頁尾宣告 -->
        <div class="mt-12 text-center text-xs text-gray-400 border-t border-gray-100 pt-4">
            感謝您的惠顧！如有任何問題，歡迎隨時與我們聯繫。
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 初始化日期為今日
        document.getElementById('quoteDate').valueAsDate = new Date();

        // 預設項目資料
        let items = [
            { description: '分行銷售例外報表新增優化及功能開發 (2027年)', quantity: 1, unit: '項', price: 150000 },
            { description: '前端網頁開發與互動動畫整合', quantity: 1, unit: '項', price: 55000 },
            { description: '後端 API 串接與資料庫系統架設', quantity: 1, unit: '項', price: 40000 },
            { description: '雲端伺服器部署與安全性設定', quantity: 1, unit: '次', price: 12000 }
        ];

        // 高度自動適應 textarea
        function autoResizeTextarea(element) {
            element.style.height = 'auto';
            element.style.height = element.scrollHeight + 'px';
        }

        // 渲染品項表格
        function renderItems() {
            const tbody = document.getElementById('itemsTableBody');
            tbody.innerHTML = '';

            items.forEach((item, index) => {
                const subtotal = item.quantity * item.price;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition align-top';
                tr.innerHTML = `
                    <td class="py-3 px-2 text-center text-gray-400 text-xs pt-4">${index + 1}</td>
                    <td class="py-3 px-2">
                        <textarea oninput="autoResizeTextarea(this); updateItem(${index}, 'description', this.value)" class="w-full bg-transparent focus:outline-none focus:bg-white rounded px-1 py-1 border border-transparent focus:border-gray-300 resize-none overflow-hidden text-sm leading-relaxed" rows="1" placeholder="品名細項/服務描述">${escapeHtml(item.description)}</textarea>
                    </td>
                    <td class="py-3 px-2 text-center">
                        <input type="number" min="0" value="${item.quantity}" onchange="updateItem(${index}, 'quantity', parseFloat(this.value) || 0)" class="w-full text-center bg-transparent focus:outline-none focus:bg-white rounded px-1 py-1 border border-transparent focus:border-gray-300 no-spinner">
                    </td>
                    <td class="py-3 px-2 text-center">
                        <input type="text" value="${escapeHtml(item.unit)}" onchange="updateItem(${index}, 'unit', this.value)" class="w-full text-center bg-transparent focus:outline-none focus:bg-white rounded px-1 py-1 border border-transparent focus:border-gray-300" placeholder="單位">
                    </td>
                    <td class="py-3 px-2 text-right">
                        <input type="number" min="0" value="${item.price}" onchange="updateItem(${index}, 'price', parseFloat(this.value) || 0)" class="w-full text-right bg-transparent focus:outline-none focus:bg-white rounded px-1 py-1 border border-transparent focus:border-gray-300 no-spinner">
                    </td>
                    <td class="py-3 px-2 text-right font-medium text-gray-700 pt-4 whitespace-nowrap">
                        NT$ ${subtotal.toLocaleString()}
                    </td>
                    <td class="py-3 px-2 text-center no-print pt-4">
                        <button onclick="removeItem(${index})" class="text-gray-300 hover:text-red-500 transition px-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);

                // 初始化輸入框高度
                const textarea = tr.querySelector('textarea');
                autoResizeTextarea(textarea);
            });

            calculateTotals();
        }

        // 新增品項
        function addItem() {
            items.push({ description: '', quantity: 1, unit: '項', price: 0 });
            renderItems();
        }

        // 刪除品項
        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }

        // 更新單一品項值
        function updateItem(index, field, value) {
            items[index][field] = value;
            calculateTotals();
        }

        // 計算總金額
        function calculateTotals() {
            const subtotal = items.reduce((sum, item) => sum + (item.quantity * item.price), 0);
            const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            const tax = Math.round(subtotal * taxRate);
            const grandTotal = subtotal + tax;

            document.getElementById('subtotalDisplay').textContent = `NT$ ${subtotal.toLocaleString()}`;
            document.getElementById('taxDisplay').textContent = `NT$ ${tax.toLocaleString()}`;
            document.getElementById('grandTotalDisplay').textContent = `NT$ ${grandTotal.toLocaleString()}`;

            // 即時更新小計欄位
            const tbody = document.getElementById('itemsTableBody');
            items.forEach((item, index) => {
                const subtotalTd = tbody.rows[index]?.cells[5];
                if (subtotalTd) {
                    subtotalTd.textContent = `NT$ ${(item.quantity * item.price).toLocaleString()}`;
                }
            });
        }

        // 圖片上傳處置 (Logo / 印章)
        function handleImageUpload(event, previewId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
